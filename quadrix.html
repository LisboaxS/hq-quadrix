<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrix</title>
    <link rel="stylesheet" href="estilo.css">
  </head>

  <body>
    <header class="contentHeader">
      <nav>
        <ul>

          <li class="home">
            <a href="quadrix.html" class="home">
              <img src="./imagens/logos/png-quadrix.png" alt="Logo">
            </a>
          </li>

          <div class="pesquisa">
            <input type="search" placeholder="Pesquise">
            <img src="./imagens/icons/search-big.svg" alt="Pesquisa" class="icone-pesquisa">
        </div>

          <div class="navegacao">
            <li><a href="quadrinhos.html">Quadrinhos</a></li>
            <li><a href="suporte.html">Suporte</a></li>
            <li><a href="login.html">Login</a></li>
          </div>

        </ul>
      </nav>
    </header>

    <!-- Carrossel -->
    
    <section class="carrossel-wrapper">
      <div class="carrossel-track">
        <div class="carrossel-slide">
          <img src="./imagens/fotos-redimencionadas/desconto.png" alt="Desconto">
        </div>

        <div class="carrossel-slide">
          <img src="./imagens/fotos-redimencionadas/frete-gratis.png" alt="Frete Grátis">
        </div>

        <div class="carrossel-slide">
          <img src="./imagens/fotos-redimencionadas/sua-jornada.png" alt="Sua Jornada">
        </div> 
      </div>

      <button class="carrossel-btn ant" onclick="moverCarrossel(-1)">&#8249;</button>
      <button class="carrossel-btn prox" onclick="moverCarrossel(1)">&#8250;</button>

      <!-- Pontos -->

      <div class="carrossel-dots">
        <span class="dot ativo" onclick="irParaSlide(0)"></span>
        <span class="dot" onclick="irParaSlide(1)"></span>
        <span class="dot" onclick="irParaSlide(2)"></span>
      </div>
    </section>


    <main>
      <section class="container">
        <div class="card">
          <a href="#">
          <img src="./imagens/hqs/batman-absoluto.webp" alt="batman-absoluto">
          </a>

          <div class="linkCard">
            <a href="#">Batman Absoluto vol. #01</a>
          </div>

          <div class="preco">
            <p>R$ 15,31</p>
          </div>

          <div class="boxBotton">
            <button type="submit" class="bottonConteudo">Comprar</button>
          </div>
        </div>

        <div class="card">
          <a href="#">
            <img src="./imagens/hqs/flash-absoluto.png" alt="flash-absoluto">
          </a>
          
          <div class="linkCard">
            <a href="#">Flash Absoluto vol #01</a>
          </div>
          
          <div class="preco">
            <p>R$ 19,90</p>
          </div>

          <div class="boxBotton">
            <button type="submit" class="bottonConteudo">Comprar</button>
          </div>
        </div>
        
        <div class="card">
          <a href="#">
            <img src="./imagens/hqs/tartarugas-ninja-idw.jpg" alt="batman-absoluto">
          </a>
          
          <div class="linkCard">
            <a href="#">Tartarugas Ninja - IDW</a>
          </div>

          <div class="preco">
            <p>R$ 142,90</p>
          </div>

          <div class="boxBotton">
            <button type="submit" class="bottonConteudo">Comprar</button>
          </div>
        </div>

      <div class="card">
          <a href="#">
            <img src="./imagens/hqs/cavaleiro-branco.webp" alt="Batman Cavaleiro Branco">
          </a>
          
          <div class="linkCard">
            <a href="#">DC de Bolso - Batman Cavaleiro Branco</a>
          </div>

          <div class="preco">
            <p>R$ 59,90</p>
          </div>

          <div class="boxBotton">
            <button type="submit" class="bottonConteudo">Comprar</button>
          </div>
        </div>


      </section>
    </main>
 


    <script src="./js/carrossel.js"></script>
    <footer >Copyrigth &copy; 2026 - Todos os direitos reservados - Comix &reg;</footer>
  </body>
</html>
