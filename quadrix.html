<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadrix</title>
  <link rel="stylesheet" href="./estilo.css">
</head>
<body>
  <header class="contentHeader">
    <nav>
      <ul>

        <li class="home">
          <a href="quadrix.html" class="home">
            <img src="./imagens/png-quadrix.png" alt="Logo">
          </a>
        </li>

        <div class="pesquisa">
          <input type="search" placeholder="Pesquise">
          <img src="./imagens/search-big.svg" alt="Pesquisa" class="icone-pesquisa">
      </div>

        <div class="navegacao">
          <li><a href="livros.html">Livros</a></li>

        </div>

      </ul>
    </nav>

<!-- Carrossel -->
   <section class="carrossel-wrapper">
  <div class="carrossel-track">
    <div class="carrossel-slide">
      <img src="./imagens/fotos-redimencionadas/desconto.png" alt="Desconto">
    </div>
    <div class="carrossel-slide">
      <img src="./imagens/fotos-redimencionadas/frete-gratis.png" alt="Frete Grátis">
    </div>
    <div class="carrossel-slide">
      <img src="./imagens/fotos-redimencionadas/sua-jornada.png" alt="Sua Jornada">
    </div>
  </div>

  <button class="carrossel-btn prev" onclick="moverCarrossel(-1)">&#8249;</button>
  <button class="carrossel-btn next" onclick="moverCarrossel(1)">&#8250;</button>

  <div class="carrossel-dots">
    <span class="dot ativo" onclick="irParaSlide(0)"></span>
    <span class="dot" onclick="irParaSlide(1)"></span>
    <span class="dot" onclick="irParaSlide(2)"></span>
  </div>
</section>
