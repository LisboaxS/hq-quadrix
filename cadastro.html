<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Comix</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="contentHeader">
      <nav>
        <ul>

          <li class="home">
            <a href="quadrix.html" class="home">
              <img src="./imagens/logos/png-quadrix.png" alt="Logo">
            </a>
          </li>

          <div class="pesquisa">
            <input type="search" placeholder="Pesquise">
            <img src="./imagens/icons/search-big.svg" alt="Pesquisa" class="icone-pesquisa">
        </div>

          <div class="navegacao">
            <li><a href="quadrinhos.html">Quadrinhos</a></li>
            <li><a href="suporte.html">Suporte</a></li>
            <li><a href="login.html">Login</a></li>
          </div>

        </ul>
      </nav>
    </header>

  <main>
  <section class="login-container">
    <div class="login-imagem">
      <img src="./imagens/logos/logo-cadastro.png" alt="Logo Quadrix">
    </div>

    <div class="cadastro-box">
      <h1>Criar conta</h1>
      <p>Preencha os dados para se cadastrar.</p>

      <form>
        <div class="campo">
          <label>Nome completo</label>
          <input type="text" placeholder="Digite seu nome">
        </div>

        <div class="campo">
          <label>Email</label>
          <input type="email" placeholder="Digite seu email">
        </div>

        <div class="campo">
          <label>Senha</label>
          <input type="password" placeholder="Crie uma senha">
        </div>

        <div class="campo">
          <label>Confirmar senha</label>
          <input type="password" placeholder="Repita a senha">
        </div>

        <button type="submit">Cadastrar</button>

        <div class="cadastro">
          Já possui conta?
          <a href="login.html">Entrar</a>
        </div>
      </form>
    </div>
  </section>
</main>
</body>
</html>
