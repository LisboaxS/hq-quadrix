<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Comix</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header>
    <nav>
      <ul>

        <li class="home">
          <a href="./index.html" class="home">
            <img src="./imagens/logos/png-quadrix.png" alt="Logo">
          </a>
        </li>

        <div class="pesquisa">
          <input type="search" placeholder="Pesquise">
          <img src="./imagens/icons/search-big.svg" alt="Pesquisa" class="icone-pesquisa">
        </div>

        <div class="navegacao">
          <li><a href="./quadrinhos.html">Quadrinhos</a></li>
          <li><a href="./suporte.html">Suporte</a></li>
          <li><a href="./login.html">Login</a></li>
        </div>

      </ul>
    </nav>
  </header>

  <main>
    <form>
      <section class="recuperacao-container">
        
        <div class="recuperacao-box">
          <h1>Recuperação de senha</h1>
          <p>Digite seu e-mail para a recuperação de senha</p>
          
          <div class="campo">
            <label>Email</label>
            <input type="email" placeholder="Digite seu email">
          </div>
          
          <div>
            <button class="botao-recuperacao" type="submit"> Enviar</button>
          </div>
        </div>
      </section>
    </form>
  </main>

</body>
</html>
