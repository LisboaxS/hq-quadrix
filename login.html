<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Quadrix</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header>
    <nav>
      <ul>

        <li class="home">
          <a href="quadrix.html" class="home">
            <img src="./imagens/png-quadrix.png" alt="Logo">
          </a>
        </li>

        <div class="pesquisa">
          <input type="search" placeholder="Pesquise">
          <img src="./imagens/search-big.svg" alt="Pesquisa" class="icone-pesquisa">
        </div>

        <div class="navegacao">
          <li><a href="#">Livros</a></li>
          <li><a href="#">Suporte</a></li>
          <li><a href="#">Login</a></li>
        </div>

      </ul>
    </nav>
  </header>

  <main>

    <section class="login-container">

      <div class="login-imagem">
        <img src="./imagens/logo-quadrix.png" alt="">
      </div>

      <div class="login-box">

        <h1>Bem-vindo</h1>
        <p>Entre na sua conta para continuar.</p>

        <form>

          <div class="campo">
            <label>Email</label>
            <input type="email" placeholder="Digite seu email">
          </div>

          <div class="campo">
            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">
          </div>

          <div class="opcoes">
            <label>
              <input type="checkbox">
              Lembrar-me
            </label>

            <a href="#">Esqueci minha senha</a>
          </div>

          <button type="submit">Entrar</button>

          <div class="cadastro">
            Não possui conta?
            <a href="#">Criar conta</a>
          </div>

        </form>

      </div>

    </section>

  </main>

  <footer>
    Copyrigth &copy; 2026 - Todos os direitos reservados - Comix &reg;
  </footer>

</body>
</html>
